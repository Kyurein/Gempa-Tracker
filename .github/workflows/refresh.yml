# Fetches new earthquakes from BMKG every 10 minutes by calling the backend.
# Needed because the Vercel-hosted backend can't run its own cron job.
# Add API_URL and REFRESH_SECRET under Settings > Secrets and variables > Actions.
name: Refresh earthquakes
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/api/refresh" \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}" \
            --retry 3 --retry-delay 20 --max-time 90
